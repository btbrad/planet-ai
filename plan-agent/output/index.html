<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <h1 class="game-title">贪吃蛇</h1>

    <div class="score-panel">
      <div class="score-item">
        <span class="score-label">得分</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">最高分</span>
        <span class="score-value" id="high-score">0</span>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="game-canvas" width="400" height="400"></canvas>
      <div class="game-overlay" id="game-overlay">
        <p class="overlay-text" id="overlay-text">按「开始游戏」或方向键开始</p>
      </div>
    </div>

    <div class="button-group">
      <button id="start-btn" class="btn btn-primary" type="button">开始游戏</button>
      <button id="pause-btn" class="btn" type="button" disabled>暂停</button>
      <button id="restart-btn" class="btn" type="button">重新开始</button>
    </div>

    <p class="tips">操作说明：方向键 ↑ ↓ ← → 或 W A S D 控制蛇的移动，空格键可暂停/继续。</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
